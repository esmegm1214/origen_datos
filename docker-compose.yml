services:
  postgres_emplea:
    image: postgres:17
    container_name: postgres_emplea
    restart: unless-stopped

    environment:
      POSTGRES_DB: emplea
      POSTGRES_USER: emplea
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - /home/dashcloudbi/docker/datos/postgres/emplea:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emplea -d emplea"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - netemplea

networks:
  netemplea:
    external: true
